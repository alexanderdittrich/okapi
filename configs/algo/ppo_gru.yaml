# @package _global_
# PPO-GRU (okapi.ppo_gru.PPOGRUConfig): PPO with a GRU after the first hidden layer.
algo: ppo_gru
num_envs: 8192
total_timesteps: 200_000_000
num_steps: 20
num_rollout_rounds: 1
num_minibatches: 32
update_epochs: 4
learning_rate: 3.0e-4
gamma: 0.97
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 1.0
reward_scaling: 1.0
norm_adv: true
actor_hidden_sizes: [512, 256, 128]
critic_hidden_sizes: [512, 256, 128]
activation: swish
gru_size: 256
warmup_stats: true
